<!DOCTYPE html>
<html>
<body>
  <form id="entryForm">
    <input type="text" name="category" value="income" />
    <input type="text" name="description" value="Test payment" />
    <input type="number" name="amount" value="3000" />
    <input type="date" name="date" value="2026-04-20" />
    <button type="submit">Add Entry</button>
  </form>

  <script>
    document.getElementById("entryForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {
        category: e.target.category.value,
        description: e.target.description.value,
        amount: parseFloat(e.target.amount.value),
        date: e.target.date.value
      };
      const res = await fetch("http://127.0.0.1:5000/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      alert(JSON.stringify(result));
    });
  </script>
</body>
</html>
